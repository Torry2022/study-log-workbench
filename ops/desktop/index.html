<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习日志工作台 · 本机运行</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/ui.css"><script src="/ui.js" defer></script></head>
<body><main><header><div class="brand"><span class="brand-mark theme-logo" aria-hidden="true"><img class="theme-logo-light" src="/app-logo-light.svg" alt=""><img class="theme-logo-dark" src="/app-logo-dark.svg" alt=""></span><div><strong>学习日志工作台</strong><span>本机运行</span></div></div><span id="state">读取状态…</span></header>
<h1>本地工作台</h1><p class="intro">选择资料目录并启动工作台。没有配置模型，也可以记录和查找日志。</p>
<p id="notice" role="status" aria-live="polite"></p>
<section><h2>资料目录</h2><div class="path"><input id="root" aria-label="资料目录" placeholder="选择专用资料目录，或填写绝对路径"><button data-pick="folder" data-for="root">选择目录</button></div>
<label>新建实例的访问密码<input id="password" type="password" autocomplete="new-password" minlength="12" placeholder="至少 12 个字符；打开已有实例无需填写"></label>
<div class="actions"><button id="create">新建实例</button><button id="select">打开已有实例</button></div><p id="current" class="hint"></p></section>
<section><h2>运行</h2><p class="hint">仅在这台电脑访问。关闭浏览器不会停止服务；备份和退出会等待正在进行的操作完成。</p><div class="actions"><button id="start" class="primary">启动工作台</button><a id="open" class="button" target="_blank" rel="noopener" hidden>打开工作台</a><button id="stop">停止服务</button><button id="exit">退出启动入口</button></div></section>
<details><summary>模型配置（可选）</summary><p class="hint">没有模型也能记录和查找日志。填写完整的兼容接口地址；模型调用会将你提交的材料发送给该服务。修改前先停止工作台。</p><label>模型接口地址<input id="apiUrl" type="url" placeholder="https://example.com/v1/chat/completions" autocomplete="off"></label><label>模型名称<input id="model" autocomplete="off"></label><label>API Key<input id="apiKey" type="password" autocomplete="new-password" placeholder="留空保留已存密钥"></label><label class="check"><input id="clearKey" type="checkbox">清除已存密钥</label><p id="keyStatus" class="hint"></p><button id="configure">保存模型配置</button></details>
<details><summary>备份与恢复</summary><p class="hint">备份包含资料、版本记录和实例配置（含密钥），请妥善保存。恢复到一个不存在的新目录，不覆盖原资料。建议另存一份到其他磁盘，以防原磁盘损坏。</p><div class="path"><input id="archive" aria-label="备份文件" placeholder="选择备份文件，或填写绝对路径"><button data-pick="archive" data-for="archive">选择备份</button></div><div class="actions"><button id="backup">保存新备份…</button><button id="verify">校验备份</button></div><label>恢复目录<input id="restoreRoot" placeholder="填写不存在的新目录的绝对路径"></label><button id="restore">恢复到新目录</button></details>
</main></body></html>
