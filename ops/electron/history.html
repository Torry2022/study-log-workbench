<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'"><title>日志历史版本</title><link rel="stylesheet" href="settings.css"></head><body class="settings-dialog"><main><h1>日志历史版本</h1><p class="hint">保留修改前的内容，方便找回误改的日志。</p><form><div class="settings-fields"><label class="check"><input type="checkbox" name="enabled">保留日志历史版本</label><label>保留期限<select name="days"><option value="0">不限期限</option><option value="30">30 天</option><option value="90">90 天</option><option value="180">180 天</option><option value="365">一年</option></select></label><p class="hint">关闭后不再记录新版本，已有版本仍可查看和恢复。</p><p class="hint">选择保留期限后，过期版本会在后续保存日志时逐步清理。</p><p class="hint">历史版本与学习记录保存在同一文件夹内，不能代替独立备份。需要备份全部记录、附件和配置时，请使用“文件 → 创建完整备份…”。</p><p class="hint">保存设置会重新打开工作台，请先保存正在编辑的内容。</p></div><p id="notice" role="status"></p><footer><button id="cancel" type="button">取消</button><button class="primary" type="submit" disabled>保存设置</button></footer></form></main><script type="module" src="history.mjs"></script></body></html>
