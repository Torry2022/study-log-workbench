<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src file:"><title>使用方式</title><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="connection.css"></head><body><main><header><div class="heading"><span class="theme-logo"><img class="logo-light" alt=""><img class="logo-dark" alt=""></span><h1 id="heading">使用方式</h1></div><p id="introduction" class="hint">在这台电脑记录学习，或连接已部署的服务器。</p></header><form><fieldset id="modes"><legend>使用方式</legend><label class="choice"><input type="radio" name="mode" value="local" checked><span>在这台电脑使用<small>记录保存在选择的文件夹中</small></span></label><label class="choice"><input type="radio" name="mode" value="remote"><span>连接工作台<small>在多台设备上访问同一份记录</small></span></label></fieldset><section class="fields"><div id="local"><label for="root">学习记录文件夹</label><div class="directory-picker"><input id="root" readonly placeholder="选择新的文件夹或已有工作台"><button class="button secondary" type="button" id="choose-directory">选择文件夹</button></div><p id="directory-state" class="hint"></p><p class="hint">日志、随记和附件保存在这个文件夹中。</p></div><div id="remote" hidden><label>工作台地址<input name="origin" placeholder="https://example.com" autocomplete="url"><small class="hint">填写平时打开工作台的网址，或向部署工作台的人获取。</small></label><label>访问密码<input name="password" type="password" autocomplete="off"><small class="hint">使用该工作台设置的访问密码。</small></label><label class="check"><input name="localHttp" type="checkbox">允许本地或局域网 HTTP 测试连接</label></div><div id="ai" hidden><label>服务商<select name="provider"><option value="deepseek">DeepSeek</option><option value="custom">自定义服务</option></select></label><label id="endpoint-field" hidden>完整接口地址<input name="endpoint" placeholder="https://example.com/v1/chat/completions"></label><label>API Key<input name="key" type="password" autocomplete="off" placeholder="填写服务商提供的 API Key"><small id="key-help" class="hint">在 DeepSeek 开放平台的 API keys 页面创建，再复制到这里。</small></label><label>模型<input name="model" placeholder="填写服务商提供的模型名称"></label></div><p id="notice" role="status"></p></section><footer><p id="footer-hint" class="hint">本地与服务器上的学习记录分别保存，不会自动同步。</p><div class="actions"><button class="button secondary" type="button" id="cancel">取消</button><button class="button secondary" type="button" id="back" hidden>返回</button><button class="button secondary" type="button" id="skip" hidden>稍后设置</button><button class="button primary" type="submit">打开本地工作台</button></div></footer></form></main><script type="module" src="connection.mjs"></script></body></html>
