<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'"><title>使用方式</title><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="connection.css"></head><body><main><h1>在哪里记录学习？</h1><p class="hint">在这台电脑保存资料，或连接已有的工作台服务器。</p><form><fieldset><legend>使用方式</legend><label class="choice"><input type="radio" name="mode" value="local" checked><span>本地使用<small>资料保存在这台电脑，无需部署服务器。</small></span></label><label class="choice"><input type="radio" name="mode" value="remote"><span>连接服务器<small>与浏览器和鸿蒙端共用服务器上的资料。</small></span></label></fieldset><div id="local"><p class="hint">资料位置</p><p id="root"></p></div><div id="remote" hidden><label>服务器地址<input name="origin" placeholder="https://example.com" autocomplete="url"></label><label>访问密码<input name="password" type="password" autocomplete="off"></label><label class="check"><input name="localHttp" type="checkbox">允许本地或局域网 HTTP 测试连接</label></div><p class="hint">两处资料各自保存，不会自动同步。切换前请保存正在编辑的内容。</p><p id="notice" role="status"></p><footer><button type="button" id="cancel">取消</button><button class="primary" type="submit">打开本地工作台</button></footer></form></main><script type="module" src="connection.mjs"></script></body></html>
