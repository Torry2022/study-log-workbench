<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'"><title>模型设置</title><link rel="stylesheet" href="settings.css"></head><body class="settings-dialog"><main><h1>模型设置</h1><p class="hint">用于日志生成和问答。不配置模型，也可以记录和查找日志。</p><form><div class="settings-fields"><label>接口地址<input name="apiUrl" type="url" placeholder="https://api.example.com/v1/chat/completions"></label><label>模型名称<input name="model" placeholder="填写服务商提供的模型名称"></label><label>API Key<input name="apiKey" type="password" autocomplete="off" placeholder="填写 API Key"></label><label class="check"><input name="clearKey" type="checkbox">清除已保存的 Key</label><p class="hint">保存后会重新打开工作台，请先保存正在编辑的内容。</p></div><p id="notice" role="status"></p><footer><button type="button" id="cancel">取消</button><button class="primary" type="submit" disabled>保存设置</button></footer></form></main><script type="module" src="settings.mjs"></script></body></html>
