<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src file:"><title>使用方式</title><link rel="stylesheet" href="settings.css"><link rel="stylesheet" href="connection.css"></head><body><main><header><div class="heading"><span class="theme-logo"><img class="logo-light" alt=""><img class="logo-dark" alt=""></span><h1>使用方式</h1></div><p class="hint">在这台电脑记录学习，或连接已部署的服务器。</p></header><form><fieldset><legend>使用方式</legend><label class="choice"><input type="radio" name="mode" value="local" checked><span>本地使用</span></label><label class="choice"><input type="radio" name="mode" value="remote"><span>连接服务器</span></label></fieldset><section class="fields"><div id="local"><label for="root">保存位置</label><div class="directory-picker"><input id="root" readonly><button class="button secondary" type="button" id="choose-directory">选择文件夹</button></div><p id="directory-state" class="hint"></p><p class="hint">日志、随记和附件保存在这个文件夹中。</p></div><div id="remote" hidden><label>服务器地址<input name="origin" placeholder="https://example.com" autocomplete="url"></label><label>访问密码<input name="password" type="password" autocomplete="off"></label><label class="check"><input name="localHttp" type="checkbox">允许本地或局域网 HTTP 测试连接</label></div><p id="notice" role="status"></p></section><footer><p class="hint">本地与服务器上的学习记录分别保存，不会自动同步。</p><div class="actions"><button class="button secondary" type="button" id="cancel">取消</button><button class="button primary" type="submit">打开本地工作台</button></div></footer></form></main><script type="module" src="connection.mjs"></script></body></html>
